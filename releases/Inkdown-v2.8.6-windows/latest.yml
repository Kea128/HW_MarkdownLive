releaseDate: '2026-11-14T05:07:41.586Z'
releaseNotes: |-
  修复
  • 修复在所见即所得中输入方括号（如 [1]）后被改成 $$ 并写入文件的问题，撤销记录和光标也不再因此丢失。
  • 修复刚输入就保存时最后几个字没有保存的问题；保存期间继续输入的内容不会被覆盖。
  • 打开 GBK 或 UTF-16 编码的文件不再乱码，保存时不会破坏原文。
  • 保存时保留空行（&lt;br /&gt;）、```latex 代码块、链接定义和 [//]: # 注释。
  • 大纲不再把代码块里的 # 注释当作标题，点击大纲能跳到正确位置。
  • 阅读模式下代码块也无法修改；自动保存遇到文件被其他程序修改时暂停并提示。
  改进
  • 保存文档、设置和恢复草稿时先写临时文件再替换，断电或磁盘已满不会留下损坏的文件；错误提示改为中文。
  • 窗口最大化与缩放比例在重启后保留，Ctrl+=、小键盘和 Ctrl+滚轮可以缩放。
  • 编辑时按住 Ctrl 单击打开链接；源码模式 Tab/Shift+Tab 缩进多行，列表与引用按钮作用于选中的每一行。
  • 窄窗口下侧栏以浮层显示；深色主题的按钮与提示文字更清晰。
  • 网络共享上的图片仅在文档位于同一服务器时加载，防止陌生文档借此获取 Windows 登录凭据；不再接管 .txt 文件关联。
