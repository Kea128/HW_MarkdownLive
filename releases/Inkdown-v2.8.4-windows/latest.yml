releaseDate: '2026-11-13T01:50:52.842Z'
releaseNotes: |-
  图片编辑
  • 单击图片显示工具栏：左对齐、居中、右对齐，宽度 25%–100% 或原始大小，修改说明，替换、打开、在文件夹中显示、复制和删除图片。
  • 拖动图片两侧的手柄调整大小并实时显示尺寸，双击手柄恢复原始大小；大小和对齐以 Typora、GitHub 都能显示的 HTML 保存。
  • 新增“编辑 &gt; 插入图片…”（Ctrl+Shift+I）和斜杠菜单“图片”，源码模式的图片按钮改为选择文件；找不到的图片会显示路径提示。
  • 新增“设置”（齿轮按钮或 Ctrl+,）选择图片保存位置并预览，支持自定义文件夹，${filename} 代表文档名。
  修复与改进
  • 修复段落左侧的块手柄响应慢的问题，现在随指针即时移动，用方向键移动光标时也会跟随。
  • 修复编辑保存后 YAML front matter 被改写成分隔线和标题、正文与表格中的 &lt;br&gt; 换行丢失的问题。
  • 保存时保留原文件的 Windows 换行（CRLF）和 UTF-8 BOM，列表符号 - 和分隔线 --- 不再被改写。
  • 源码模式工具栏的格式操作可以用 Ctrl+Z 撤销；斜杠菜单改为中文；长文档输入更流畅。
